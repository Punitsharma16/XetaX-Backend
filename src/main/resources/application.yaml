server:
  port: 8085
  # Behind Caddy, TLS ends at the proxy and the app is reached over plain http.
  # Without this Spring builds absolute URLs from the inbound request and sends
  # Google http://api…/login/oauth2/code/google, which fails as a
  # redirect_uri_mismatch. Honour the proxy's X-Forwarded-Proto/Host instead.
  forward-headers-strategy: framework

spring:
  application:
    name: crm

  # Jackson 3 fails a request whose JSON leaves a primitive boolean out
  # (register without the enable/admin flags → 500). Every client of ours and
  # every integrator's client may omit them — take the field's default instead.
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  ai:
    # Spring AI chat memory (RediSearch index) — same Redis as spring.data.redis.
    # Needs Redis Stack (redis/redis-stack-server); plain redis lacks RediSearch
    # and the app then falls back to in-memory conversation memory.
    chat:
      memory:
        redis:
          host: ${REDIS_HOST:localhost}
          port: ${REDIS_PORT:6379}
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      chat:
        # Env-switchable — reasoning models (gpt-oss) think long on tool calls;
        # llama-3.3-70b answers tool rounds far faster on Groq.
        model: ${GROQ_CHAT_MODEL:openai/gpt-oss-20b}

      embedding:
        api-key: ${COHERE_API_KEY:}
        base-url: https://api.cohere.ai/compatibility/v1
        model: embed-v4.0

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        # gRPC port (Spring AI talks gRPC, not the 6333 REST port).
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: xetax-knowledge
        content-field-name: doc_content
        use-tls: false
        # false => no Qdrant connection at BOOT, so the panel stays up even
        # when the vector DB is down (AI knowledge degrades gracefully).
        # Set QDRANT_INIT_SCHEMA=true once on a brand-new deployment to
        # create the collection, then turn it back off.
        initialize-schema: ${QDRANT_INIT_SCHEMA:false}


  # SMTP for outgoing email (meeting invites, SEND_EMAIL automations).
  # Leave SMTP_HOST empty => email disabled; EmailService logs instead of failing.
  # Gmail example: host smtp.gmail.com, port 587, username = your gmail,
  # password = App Password (Google Account -> Security -> App passwords).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/crm}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:redhat}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    # Verbose locally; compose sets JPA_SHOW_SQL=false so prod logs stay clean.
    show-sql: ${JPA_SHOW_SQL:true}

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Spring Boot 4: MongoDB settings live under spring.mongodb (the old
  # spring.data.mongodb.uri is deprecated and silently IGNORED — that is why
  # the container kept dialling localhost:27017 despite MONGODB_URI being set).
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/crm}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # We use Redis as cache/rate-limit store only (RedisTemplate), never as a
      # repository backend — this stops Spring Data Redis from scanning every
      # JPA/Mongo repository at boot and logging a "store assignment" line each.
      repositories:
        enabled: false

  # Kafka — queues WhatsApp campaign sends and webhook delivery reports (DLRs).
  # The app boots fine when the broker is down (producers fall back to inline
  # processing); start Kafka with the docker command in XETAX_KAFKA_GUIDE.md.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Shared client settings: without a backoff the Kafka clients hammer a
    # down broker in a tight loop and flood the logs; with these the app
    # boots normally and retries quietly until the broker appears.
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 30000
    admin:
      fail-fast: false
      properties:
        default.api.timeout.ms: 5000
        request.timeout.ms: 5000
    consumer:
      group-id: xetax-crm
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # producer gives up fast when the broker is down so the inline
        # fallback path kicks in instead of hanging the request
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    listener:
      missing-topics-fatal: false
      # Compose sets KAFKA_LISTENERS_ENABLED=false (no broker) so the consumers
      # never start; producers already fall back to inline processing.
      auto-startup: ${KAFKA_LISTENERS_ENABLED:true}

  # OAuth2 social login (ported from the auth service). The placeholder
  # defaults let the application boot without real credentials; set the env
  # vars to actually use Google/GitHub login.
  security:
    oauth2:
      client:
        registration:

          # NOTE: an EMPTY GOOGLE_CLIENT_ID env var kills the boot ("must not be
          # empty") — leave the key out of .env until you have real values.
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            # Pinned to the public API host so the callback never depends on the
            # scheme of a proxied request. Must match Google Cloud Console →
            # Credentials → Authorized redirect URIs character for character.
            redirect-uri: ${APP_API_BASE_URL:http://localhost:8085}/login/oauth2/code/google
            scope:
              - email
              - profile
              - openid


# Same secret/issuer defaults the auth service and gateway shared — tokens
# issued before the merge stay valid.
security:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-1234567890123456789012345678901234567890}
    issuer: ${ISSUER:api.substring.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie-domain: ${JWT_DOMAIN:localhost}

# Kafka clients log every reconnect attempt at INFO — with the broker down
# that floods the console ("Rebootstrapping with localhost:9092" spam). WARN
# keeps real problems visible while silencing the retry chatter; the app's
# own Kafka messages (publish fallback etc.) log under com.xetax and stay.
logging:
  level:
    org.apache.kafka: WARN

# SMTP host is optionally blank (email disabled) — the mail health indicator
# would mark the whole /actuator/health DOWN for that, so it is excluded.
management:
  health:
    mail:
      enabled: false

# WhatsApp Business Platform (Meta Cloud API). Every value is env-driven —
# real credentials live only in .env / environment, never in this file.
meta:
  whatsapp:
    graph-api-version: ${META_GRAPH_API_VERSION:v23.0}
    graph-base-url: ${META_GRAPH_BASE_URL:https://graph.facebook.com}
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    config-id: ${META_WHATSAPP_CONFIG_ID:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:xetax-verify-token}
    token-encryption-key: ${WHATSAPP_TOKEN_ENCRYPTION_KEY:}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
    sends-per-minute: ${WHATSAPP_SENDS_PER_MINUTE:60}
    api-connect-timeout-ms: ${META_API_CONNECT_TIMEOUT_MS:5000}
    api-read-timeout-ms: ${META_API_READ_TIMEOUT_MS:15000}
    api-max-retries: ${META_API_MAX_RETRIES:2}

  # Facebook / Instagram lead ads. Same Meta app as WhatsApp above — only the
  # Facebook-Login-for-Business configuration and the webhook token differ.
  ads:
    config-id: ${META_LEADS_CONFIG_ID:}
    webhook-verify-token: ${META_LEADS_WEBHOOK_VERIFY_TOKEN:}
    insights-lookback-days: ${META_INSIGHTS_LOOKBACK_DAYS:7}

# In-app video meetings (WebRTC). public-base-url builds the guest links that
# get WhatsApp'd / emailed — set APP_PUBLIC_BASE_URL to the real domain in prod.
app:
  # Emails promoted to platform admin on every boot (comma separated).
  platform-admin-emails: ${PLATFORM_ADMIN_EMAILS:}
  # Where uploaded documents are stored on disk.
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  # Accounts opened on/after this date start with the WhatsApp morning digest
  # off (Meta charges for every business message from 1 Oct 2026). Older
  # accounts keep the digest they always had.
  digest-whatsapp-off-for-accounts-from: ${DIGEST_WHATSAPP_OFF_FROM:2026-09-18}
  # WhatsApp charge estimate: Meta's month starts at midnight in the WABA's zone.
  whatsapp-billing-zone: ${WHATSAPP_BILLING_ZONE:Asia/Kolkata}
  # Service messages Meta does not charge each month. 0 until Meta confirms one.
  # Meta's allowance from 1 October 2026: 1,000 delivered service messages
  # per business phone number per month.
  whatsapp-free-service-per-month: ${WHATSAPP_FREE_SERVICE_PER_MONTH:1000}

  # How long the WhatsApp bot waits for the customer to finish typing before it
  # answers. A burst of lines then costs one reply instead of one per line.
  # 0 answers immediately, as it did before; anything above 30 is capped.
  bot-burst-window-seconds: ${BOT_BURST_WINDOW_SECONDS:3}
  # Largest inbound WhatsApp file to pull from Meta and keep (25 MB). Anything
  # bigger stays on Meta: the message still shows, just without a link.
  whatsapp-media-max-bytes: ${WHATSAPP_MEDIA_MAX_BYTES:26214400}
  # Comma-separated browser origins allowed to call the API (the panel's URL).
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5000}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5000}
  # Backend's own public URL — embed snippets ke liye (widget.js isi se load hota hai)
  api-base-url: ${APP_API_BASE_URL:http://localhost:8085}
  # Shared secret for the back-office /api/internal/billing endpoints (plan
  # activation via curl). Empty = those endpoints are disabled.
  internal-admin-key: ${INTERNAL_ADMIN_KEY:}
  meetings:
    max-participants: ${MEETING_MAX_PARTICIPANTS:5}

# ── Voice assistant ────────────────────────────────────────────────────────
# Speech in, speech out, over /ws/voice. Both providers have a free tier and
# both sit behind an interface, so either can be swapped without touching the
# assistant.
voice:
  # Turn the whole feature off without removing it.
  enabled: ${VOICE_ENABLED:true}

  stt:
    # Groq's hosted Whisper — the same GROQ_API_KEY the chat model already uses.
    # turbo is the fast variant; it also reports which language was spoken,
    # which is what makes the assistant answer in that language.
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_STT_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_STT_MODEL:whisper-large-v3-turbo}
    # Utterances longer than this are rejected rather than uploaded.
    max-seconds: ${VOICE_MAX_SECONDS:30}
    max-bytes: ${VOICE_MAX_BYTES:6291456}

  tts:
    # Azure Speech free tier (F0): 500,000 characters a month, the same neural
    # voices Windows and Edge use — they do not sound synthetic. Key and region
    # come from portal.azure.com -> Speech service.
    # Empty key => the socket still works, it just sends no audio back.
    provider: ${VOICE_TTS_PROVIDER:azure}
    api-key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:centralindia}
    # audio-24khz-48kbitrate-mono-mp3 plays on both phones with no decoding work.
    output-format: ${AZURE_SPEECH_FORMAT:audio-24khz-48kbitrate-mono-mp3}
    # Slightly quicker than the default reads as attentive rather than sleepy.
    rate: ${VOICE_TTS_RATE:+8%}
    pitch: ${VOICE_TTS_PITCH:+0Hz}
    # Spoken replies are capped — a paragraph read aloud is unbearable, and it
    # burns the free character budget.
    max-chars: ${VOICE_TTS_MAX_CHARS:600}

  # How long a socket may sit idle before it is closed (seconds).
  session-idle-seconds: ${VOICE_SESSION_IDLE_SECONDS:900}

  # Look the question up in the knowledge base before answering. Keeps the
  # assistant able to explain XetaX itself, at the cost of one embedding call
  # (~0.5s) on every spoken turn. Turn it off if latency matters more than
  # product questions — the CRM tools are unaffected either way.
  rag-enabled: ${VOICE_RAG_ENABLED:true}

# Razorpay — AI top-up checkout only (plan upgrades stay manual for now).
# Keys: dashboard.razorpay.com -> Account & Settings -> API Keys.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

xetax:
  kafka:
    # false = never touch the producer (no broker deployed); events are processed inline.
    publish-enabled: ${KAFKA_PUBLISH_ENABLED:true}
  email:
    campaign:
      # Bulk email goes out from each org's OWN SMTP (Profile → Email). Pacing is
      # per owner so one blast never trips that mailbox's burst limits.
      max-recipients: ${EMAIL_CAMPAIGN_MAX_RECIPIENTS:5000}
      sends-per-minute: ${EMAIL_CAMPAIGN_SENDS_PER_MINUTE:60}
