# XetaX CRM — full production stack on ONE box.
#   cd crm/deploy && cp .env.prod.example .env && edit .env && docker compose up -d --build
#
# Services: app (Spring Boot) · mysql · mongo · redis · qdrant · caddy (HTTPS + frontend + website)
# Kafka is intentionally NOT here — the app falls back to inline processing.
# Only caddy publishes ports (80/443). Every database is internal-only.

name: xetax

services:

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile

    image: xetax/crm:1.0.0

    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:mysql://mysql:3306/crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/crm?authSource=admin

      REDIS_HOST: redis
      REDIS_PORT: 6379

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334   # gRPC — the app does not use the 6333 REST port
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      APP_UPLOAD_DIR: /app/uploads
      JWT_COOKIE_SECURE: "true"
      JPA_SHOW_SQL: "false"
      KAFKA_LISTENERS_ENABLED: "false"

      # Heap 700m inside a 1100m container: leaves room for metaspace, threads,
      # Mongo/MySQL drivers and the Groq HTTP client — no OOM-kill at peak.
      JAVA_TOOL_OPTIONS: >
        -Xms256m
        -Xmx700m
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError

    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

    volumes:
      - uploads:/app/uploads

    mem_limit: 1100m

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:8085/actuator/health | grep -q UP || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"



  mysql:

    image: mysql:8.4.6

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: crm
      TZ: Asia/Kolkata

    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=80
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-name-resolve

    volumes:
      - ./data/mysql:/var/lib/mysql

    mem_limit: 420m

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"



  mongo:

    image: mongo:7.0.14

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    command:
      - --auth
      - --wiredTigerCacheSizeGB
      - "0.25"

    volumes:
      - ./data/mongo:/data/db

    mem_limit: 320m

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"



  redis:

    # Redis Stack = Redis + RediSearch/JSON, required by the AI chat-memory index.
    image: redis/redis-stack-server:7.4.0-v3

    restart: unless-stopped

    environment:
      REDIS_ARGS: "--maxmemory 160mb --maxmemory-policy allkeys-lru --save 60 1"

    volumes:
      - ./data/redis:/data

    mem_limit: 260m

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 3s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"



  qdrant:

    image: qdrant/qdrant:v1.17.0   # matches the Java client (1.17) — minor versions must be within 1

    restart: unless-stopped

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

    volumes:
      - ./data/qdrant:/qdrant/storage

    mem_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"



  caddy:

    image: caddy:2.10-alpine

    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    mem_limit: 80m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"



volumes:
  uploads:
  caddy-data:
  caddy-config: